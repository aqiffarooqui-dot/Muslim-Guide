name: Build Muslim Guide Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Add Android platform when not committed
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk "release/Muslim-Guide-debug-${{ github.run_number }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Muslim-Guide-Android-${{ github.run_number }}
          path: release/Muslim-Guide-debug-${{ github.run_number }}.apk
          retention-days: 30

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-${{ github.run_number }}"
          gh release create "$TAG" "release/Muslim-Guide-debug-${{ github.run_number }}.apk" \
            --title "Muslim Guide Android build ${{ github.run_number }}" \
            --notes "Automatic Android APK build from main commit ${{ github.sha }}. This is a debug APK for testing; production in-app updates will use a stable release signing key / Google Play distribution." \
            --target "${{ github.sha }}"
