name: Build Muslim Guide Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Set Android release version
        id: version
        shell: bash
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version")
          VERSION_NAME="${BASE_VERSION}.${GITHUB_RUN_NUMBER}"
          VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Build web app
        env:
          VITE_APP_VERSION: ${{ steps.version.outputs.version_name }}
        run: npm run build

      - name: Add Android platform when not committed
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Configure Android version
        working-directory: android
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle')
          s = p.read_text()
          s = s.replace('versionCode 1', f'versionCode {__import__("os").environ["VERSION_CODE"]}')
          s = s.replace('versionName "1.0"', f'versionName "{__import__("os").environ["VERSION_NAME"]}"')
          p.write_text(s)
          PY

      - name: Restore production signing key when configured
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/muslim-guide-release.jks
          cat > android/keystore.properties <<'EOF'
          storeFile=muslim-guide-release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          s = p.read_text()
          marker = 'android {'
          signing = '''android {
              def keystorePropertiesFile = rootProject.file("keystore.properties")
              def keystoreProperties = new Properties()
              if (keystorePropertiesFile.exists()) { keystoreProperties.load(new FileInputStream(keystorePropertiesFile)) }
              signingConfigs {
                  release {
                      if (keystorePropertiesFile.exists()) {
                          storeFile file(keystoreProperties['storeFile'])
                          storePassword keystoreProperties['storePassword']
                          keyAlias keystoreProperties['keyAlias']
                          keyPassword keystoreProperties['keyPassword']
                      }
                  }
              }
          '''
          if marker in s and 'signingConfigs {' not in s:
              s = s.replace(marker, signing, 1)
          s = s.replace('buildTypes {', 'buildTypes {', 1)
          s = s.replace('release {', 'release {\n            signingConfig signingConfigs.release', 1)
          p.write_text(s)
          PY

      - name: Build release APK
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Build debug APK (until production key is configured)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 == '' }}
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare APK release asset
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          mkdir -p release
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "release/Muslim-Guide-${VERSION_NAME}.apk"
            echo "BUILD_TYPE=production-signed" >> "$GITHUB_ENV"
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk "release/Muslim-Guide-${VERSION_NAME}-debug.apk"
            echo "BUILD_TYPE=debug" >> "$GITHUB_ENV"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Muslim-Guide-Android-${{ steps.version.outputs.version_name }}
          path: release/*.apk
          retention-days: 30

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          TAG="v${VERSION_NAME}"
          gh release create "$TAG" release/*.apk \
            --title "Muslim Guide $VERSION_NAME" \
            --notes "Automatic Android build from main commit ${{ github.sha }}. Build type: $BUILD_TYPE. Production in-app updates require a stable production signing key; configure the ANDROID_KEYSTORE_* repository secrets before distributing signed updates." \
            --target "${{ github.sha }}"
