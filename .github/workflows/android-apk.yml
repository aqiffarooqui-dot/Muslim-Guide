name: Build Muslim Guide Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor CLI
        run: npm install --no-save @capacitor/cli@7.4.0

      - name: Set app version
        id: version
        shell: bash
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version")
          echo "version_name=${BASE_VERSION}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "version_code=$((100000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

      - name: Build web app
        env:
          VITE_APP_VERSION: ${{ steps.version.outputs.version_name }}
        run: npm run build

      - name: Prepare Capacitor Android
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Prepare Android Gradle configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/build.gradle')
          text = path.read_text()
          if 'compileSdk' not in text and 'compileSdkVersion' not in text:
              text = text.replace('android {', 'android {\n    compileSdk 35', 1)
          path.write_text(text)
          PY

      - name: Prepare release signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD"; exit 1; }

          printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > android/muslim-guide-release.jks
          test -s android/muslim-guide-release.jks
          keytool -list -keystore android/muslim-guide-release.jks -storepass "$KEYSTORE_PASSWORD" >/dev/null

          cat > android/keystore.properties <<EOF
          storeFile=muslim-guide-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/build.gradle')
          text = path.read_text()

          if 'signingConfigs {' not in text:
              block = """
              def keystorePropertiesFile = rootProject.file('keystore.properties')
              def keystoreProperties = new Properties()
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

              signingConfigs {
                  release {
                      storeFile file(keystoreProperties['storeFile'])
                      storePassword keystoreProperties['storePassword']
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                  }
              }
              """
              block = '\n'.join('    ' + line if line else '' for line in block.strip('\n').split('\n')) + '\n'
              text = text.replace('android {', 'android {\n' + block, 1)

          if 'signingConfig signingConfigs.release' not in text:
              marker = '        release {'
              pos = text.find(marker, text.find('buildTypes'))
              if pos == -1:
                  raise SystemExit('Could not locate buildTypes release block')
              insert_at = pos + len(marker)
              text = text[:insert_at] + '\n            signingConfig signingConfigs.release' + text[insert_at:]

          path.write_text(text)
          PY

      - name: Configure Android version
        working-directory: android
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          path = Path('app/build.gradle')
          text = path.read_text()
          text = text.replace('versionCode 1', 'versionCode ' + os.environ['VERSION_CODE'], 1)
          text = text.replace('versionName "1.0"', 'versionName "' + os.environ['VERSION_NAME'] + '"', 1)
          path.write_text(text)
          PY

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Package APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          set -euo pipefail
          mkdir -p release
          APK_PATH=$(find android/app/build/outputs/apk -type f -name '*.apk' -print -quit)
          if [ -z "$APK_PATH" ]; then
            echo "No APK found. Available APK outputs:"
            find android/app/build/outputs -type f -name '*.apk' -print || true
            exit 1
          fi
          echo "Packaging APK: $APK_PATH"
          cp "$APK_PATH" "release/Muslim-Guide-${VERSION_NAME}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Muslim-Guide-Android-${{ steps.version.outputs.version_name }}
          path: release/*.apk
          retention-days: 30

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          gh release create "v${VERSION_NAME}" release/*.apk --title "Muslim Guide ${VERSION_NAME}" --notes "Automatic signed Android build." --target "${GITHUB_SHA}"
