name: Build Muslim Guide Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor CLI
        run: npm install --no-save @capacitor/cli@7.4.0

      - name: Set app version
        id: version
        shell: bash
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version")
          echo "version_name=${BASE_VERSION}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "version_code=$((100000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

      - name: Build web app
        env:
          VITE_APP_VERSION: ${{ steps.version.outputs.version_name }}
        run: npm run build

      - name: Prepare Capacitor Android
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Prepare Android Gradle configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text()

          if "compileSdkVersion" not in text and "compileSdk " not in text:
              text = text.replace("android {", "android {\n    compileSdk 35", 1)

          path.write_text(text)
          PY

      - name: Prepare release signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_B64" || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD"; exit 1; }

          KEYSTORE_B64_CLEAN=$(printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]')
          case $(( ${#KEYSTORE_B64_CLEAN} % 4 )) in
            0) ;;
            2) KEYSTORE_B64_CLEAN="${KEYSTORE_B64_CLEAN}==" ;;
            3) KEYSTORE_B64_CLEAN="${KEYSTORE_B64_CLEAN}=" ;;
            1) echo "Invalid keystore Base64 length"; exit 1 ;;
          esac

          KEYSTORE_B64="$KEYSTORE_B64_CLEAN" python3 - <<'PY'
          import base64
          import os

          data = base64.b64decode(os.environ["KEYSTORE_B64"], validate=True)
          if len(data) < 100:
              raise SystemExit("Decoded keystore is unexpectedly small")

          with open("android/muslim-guide-release.jks", "wb") as handle:
              handle.write(data)
          PY

          keytool -list -keystore android/muslim-guide-release.jks -storepass "$KEYSTORE_PASSWORD" >/dev/null

          printf '%s\n' \
            "storeFile=muslim-guide-release.jks" \
            "storePassword=$KEYSTORE_PASSWORD" \
            "keyAlias=$KEY_ALIAS" \
            "keyPassword=$KEY_PASSWORD" \
            > android/keystore.properties

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")
          text = path.read_text()

          if "keystorePropertiesFile" not in text:
              signing_block = """
    def keystorePropertiesFile = rootProject.file('keystore.properties')
    def keystoreProperties = new Properties()
    if (keystorePropertiesFile.exists()) {
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
"""
              text = text.replace("android {", "android {" + signing_block, 1)

          if "signingConfig signingConfigs.release" not in text:
              pattern = r"(buildTypes\s*\{\s*release\s*\{)"
              text, count = re.subn(
                  pattern,
                  r"\1\n            signingConfig signingConfigs.release",
                  text,
                  count=1,
          )
              if count != 1:
                  raise SystemExit("Could not locate generated buildTypes release block")

          path.write_text(text)
          PY

      - name: Configure Android version
        working-directory: android
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          path = Path("app/build.gradle")
          text = path.read_text()
          text = text.replace("versionCode 1", "versionCode " + os.environ["VERSION_CODE"], 1)
          text = text.replace("versionName \"1.0\"", "versionName \"" + os.environ["VERSION_NAME"] + "\"", 1)
          path.write_text(text)
          PY

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Package APK
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          set -euo pipefail
          mkdir -p release
          APK_PATH=$(find android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK was generated. Available output files:"
            find android/app/build/outputs -type f | sort || true
            exit 1
          fi
          echo "Packaging APK: $APK_PATH"
          cp "$APK_PATH" "release/Muslim-Guide-${VERSION_NAME}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Muslim-Guide-Android-${{ steps.version.outputs.version_name }}
          path: release/*.apk
          retention-days: 30

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          gh release create "v${VERSION_NAME}" release/*.apk --title "Muslim Guide ${VERSION_NAME}" --notes "Automatic signed Android build." --target "${GITHUB_SHA}"
