name: Build Muslim Guide Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor CLI
        run: npm install --no-save @capacitor/cli@7.4.0

      - name: Set app version
        id: version
        shell: bash
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version")
          echo "version_name=${BASE_VERSION}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "version_code=$((100000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

      - name: Build web app
        env:
          VITE_APP_VERSION: ${{ steps.version.outputs.version_name }}
        run: npm run build

      - name: Prepare Capacitor Android
        run: |
          set -euo pipefail
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Add native APK updater
        shell: bash
        run: |
          set -euo pipefail
          APP_PACKAGE="com.muslimguide.app"
          JAVA_DIR="android/app/src/main/java/${APP_PACKAGE//.//}"
          mkdir -p "$JAVA_DIR" android/app/src/main/res/xml

          cat > "$JAVA_DIR/AppUpdaterPlugin.java" <<'JAVA'
          package com.muslimguide.app;

          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.Settings;

          import androidx.core.content.FileProvider;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          @CapacitorPlugin(name = "AppUpdater")
          public class AppUpdaterPlugin extends Plugin {
              private final ExecutorService executor = Executors.newSingleThreadExecutor();

              @PluginMethod
              public void install(PluginCall call) {
                  String url = call.getString("url");
                  if (url == null || url.trim().isEmpty()) {
                      call.reject("Missing update URL");
                      return;
                  }

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O &&
                      !getContext().getPackageManager().canRequestPackageInstalls()) {
                      Intent settings = new Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES);
                      settings.setData(Uri.parse("package:" + getContext().getPackageName()));
                      settings.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(settings);
                      JSObject result = new JSObject();
                      result.put("needsPermission", true);
                      call.resolve(result);
                      return;
                  }

                  executor.execute(() -> {
                      try {
                          File dir = getContext().getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS);
                          if (dir == null) throw new IllegalStateException("Download directory unavailable");
                          if (!dir.exists() && !dir.mkdirs()) throw new IllegalStateException("Could not create download directory");

                          File apk = new File(dir, "Muslim-Guide-update.apk");
                          HttpURLConnection connection = (HttpURLConnection) new URL(url).openConnection();
                          connection.setInstanceFollowRedirects(true);
                          connection.setConnectTimeout(30000);
                          connection.setReadTimeout(120000);
                          connection.setRequestProperty("User-Agent", "Muslim-Guide-Updater");
                          connection.connect();

                          int code = connection.getResponseCode();
                          if (code < 200 || code >= 300) throw new IllegalStateException("Download failed: HTTP " + code);

                          try (InputStream input = connection.getInputStream(); FileOutputStream output = new FileOutputStream(apk)) {
                              byte[] buffer = new byte[8192];
                              int read;
                              while ((read = input.read(buffer)) != -1) output.write(buffer, 0, read);
                          } finally {
                              connection.disconnect();
                          }

                          if (!apk.isFile() || apk.length() == 0) throw new IllegalStateException("Downloaded APK is empty");

                          Uri uri = FileProvider.getUriForFile(
                              getContext(),
                              getContext().getPackageName() + ".fileprovider",
                              apk
                          );

                          Intent installer = new Intent(Intent.ACTION_INSTALL_PACKAGE);
                          installer.setDataAndType(uri, "application/vnd.android.package-archive");
                          installer.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                          getContext().startActivity(installer);

                          JSObject result = new JSObject();
                          result.put("started", true);
                          call.resolve(result);
                      } catch (Exception error) {
                          call.reject(error.getMessage() == null ? "Update failed" : error.getMessage());
                      }
                  });
              }
          }
          JAVA

          cat > android/app/src/main/res/xml/file_paths.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <external-files-path name="apk_downloads" path="Download/" />
          </paths>
          XML

          python3 - <<'PY'
          from pathlib import Path

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          if 'android.permission.REQUEST_INSTALL_PACKAGES' not in text:
              text = text.replace('<manifest ', '<manifest \n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n', 1)
          provider = '''\n        <provider\n            android:name="androidx.core.content.FileProvider"\n            android:authorities="${applicationId}.fileprovider"\n            android:exported="false"\n            android:grantUriPermissions="true">\n            <meta-data\n                android:name="android.support.FILE_PROVIDER_PATHS"\n                android:resource="@xml/file_paths" />\n        </provider>'''
          if 'androidx.core.content.FileProvider' not in text:
              text = text.replace('</application>', provider + '\n    </application>', 1)
          manifest.write_text(text)

          mains = list(Path('android/app/src/main').rglob('MainActivity.java'))
          if not mains:
              mains = list(Path('android/app/src/main').rglob('MainActivity.kt'))
          if not mains:
              raise SystemExit('MainActivity.java/kt not found')
          main = mains[0]
          text = main.read_text()

          if main.suffix == '.java':
              if 'import android.os.Bundle;' not in text:
                  text = text.replace('package com.muslimguide.app;\n', 'package com.muslimguide.app;\n\nimport android.os.Bundle;\n', 1)
              if 'import com.muslimguide.app.AppUpdaterPlugin;' not in text:
                  text = text.replace('import com.getcapacitor.BridgeActivity;\n', 'import com.getcapacitor.BridgeActivity;\nimport com.muslimguide.app.AppUpdaterPlugin;\n', 1)
              if 'registerPlugin(AppUpdaterPlugin.class)' not in text:
                  if 'public class MainActivity extends BridgeActivity {}' in text:
                      text = text.replace('public class MainActivity extends BridgeActivity {}', '''public class MainActivity extends BridgeActivity {\n    @Override\n    public void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        registerPlugin(AppUpdaterPlugin.class);\n    }\n}''')
                  else:
                      marker = 'public class MainActivity extends BridgeActivity {'
                      if marker not in text:
                          raise SystemExit('Unexpected MainActivity.java structure')
                      text = text.replace(marker, marker + '''\n    @Override\n    public void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        registerPlugin(AppUpdaterPlugin.class);\n    }''', 1)
          else:
              if 'import android.os.Bundle' not in text:
                  text = text.replace('package com.muslimguide.app\n', 'package com.muslimguide.app\n\nimport android.os.Bundle\n', 1)
              if 'import com.muslimguide.app.AppUpdaterPlugin' not in text:
                  text = text.replace('import com.getcapacitor.BridgeActivity', 'import com.getcapacitor.BridgeActivity\nimport com.muslimguide.app.AppUpdaterPlugin', 1)
              if 'registerPlugin(AppUpdaterPlugin::class.java)' not in text:
                  if 'class MainActivity : BridgeActivity()' not in text:
                      raise SystemExit('Unexpected MainActivity.kt structure')
                  text = text.replace('class MainActivity : BridgeActivity()', '''class MainActivity : BridgeActivity() {\n    override fun onCreate(savedInstanceState: Bundle?) {\n        super.onCreate(savedInstanceState)\n        registerPlugin(AppUpdaterPlugin::class.java)\n    }\n}''', 1)

          main.write_text(text)
          PY

      - name: Prepare Android Gradle configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/build.gradle')
          text = path.read_text()
          if 'compileSdk' not in text and 'compileSdkVersion' not in text:
              text = text.replace('android {', 'android {\n    compileSdk 35', 1)
          if "androidx.core:core:" not in text:
              if 'dependencies {' in text:
                  text = text.replace('dependencies {', 'dependencies {\n    implementation "androidx.core:core:1.15.0"', 1)
              else:
                  text += '\n\ndependencies {\n    implementation "androidx.core:core:1.15.0"\n}\n'
          path.write_text(text)
          PY

      - name: Prepare release signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD"; exit 1; }

          python3 - "$KEYSTORE_B64" <<'PY'
          import base64
          import binascii
          import sys
          from pathlib import Path

          raw = sys.argv[1].strip()
          compact = ''.join(raw.split())
          compact += '=' * ((4 - len(compact) % 4) % 4)
          try:
              data = base64.b64decode(compact, validate=True)
          except (binascii.Error, ValueError) as exc:
              raise SystemExit(f"ANDROID_KEYSTORE_BASE64 is not valid base64: {exc}")
          if not data:
              raise SystemExit("ANDROID_KEYSTORE_BASE64 decoded to an empty file")
          Path('android/muslim-guide-release.jks').write_bytes(data)
          PY

          KEYSTORE_PATH="$GITHUB_WORKSPACE/android/muslim-guide-release.jks"
          test -s "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" >/dev/null

          cat > android/keystore.properties <<EOF
          storeFile=$KEYSTORE_PATH
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

          test -f android/keystore.properties
          grep -q '^storeFile=' android/keystore.properties
          grep -q '^storePassword=' android/keystore.properties
          grep -q '^keyAlias=' android/keystore.properties
          grep -q '^keyPassword=' android/keystore.properties

          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/build.gradle')
          text = path.read_text()

          if 'signingConfigs {' not in text:
              block = """
              def keystorePropertiesFile = rootProject.file('keystore.properties')
              def keystoreProperties = new Properties()
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

              signingConfigs {
                  release {
                      storeFile file(keystoreProperties['storeFile'])
                      storePassword keystoreProperties['storePassword']
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                  }
              }
              """
              block = '\n'.join('    ' + line if line else '' for line in block.strip('\n').split('\n')) + '\n'
              text = text.replace('android {', 'android {\n' + block, 1)

          if 'signingConfig signingConfigs.release' not in text:
              marker = '        release {'
              pos = text.find(marker, text.find('buildTypes'))
              if pos == -1:
                  raise SystemExit('Could not locate buildTypes release block')
              insert_at = pos + len(marker)
              text = text[:insert_at] + '\n            signingConfig signingConfigs.release' + text[insert_at:]

          path.write_text(text)
          PY

      - name: Configure Android version
        working-directory: android
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          path = Path('app/build.gradle')
          text = path.read_text()
          text = text.replace('versionCode 1', 'versionCode ' + os.environ['VERSION_CODE'], 1)
          text = text.replace('versionName "1.0"', 'versionName "' + os.environ['VERSION_NAME'] + '"', 1)
          path.write_text(text)
          PY

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify signed APK output
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t APKS < <(find android/app/build/outputs/apk/release -type f -name '*.apk' -print)
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "No release APK found. Available APK outputs:"
            find android/app/build/outputs -type f -name '*.apk' -print || true
            exit 1
          fi
          echo "Release APK(s):"
          printf '%s\n' "${APKS[@]}"

      - name: Package APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          set -euo pipefail
          mkdir -p release
          APK_PATH=$(find android/app/build/outputs/apk/release -type f -name '*.apk' -print -quit)
          if [ -z "$APK_PATH" ]; then
            echo "No release APK found. Available APK outputs:"
            find android/app/build/outputs -type f -name '*.apk' -print || true
            exit 1
          fi
          echo "Packaging APK: $APK_PATH"
          cp "$APK_PATH" "release/Muslim-Guide-${VERSION_NAME}.apk"
          test -s "release/Muslim-Guide-${VERSION_NAME}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Muslim-Guide-Android-${{ steps.version.outputs.version_name }}
          path: release/*.apk
          retention-days: 30

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          set -euo pipefail
          gh release create "v${VERSION_NAME}" release/*.apk --title "Muslim Guide ${VERSION_NAME}" --notes "Automatic signed Android build from main." --target "${GITHUB_SHA}"
