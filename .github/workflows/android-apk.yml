name: Build Muslim Guide Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor CLI
        run: npm install --no-save @capacitor/cli@7.4.0

      - name: Set app version
        id: version
        shell: bash
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version")
          echo "version_name=${BASE_VERSION}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "version_code=$((100000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

      - name: Build web app
        env:
          VITE_APP_VERSION: ${{ steps.version.outputs.version_name }}
        run: npm run build

      - name: Prepare Capacitor Android
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Prepare release signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD"; exit 1; }

          # Normalize copy/paste formatting without exposing the secret.
          # Some editors/GitHub secret pastes can drop trailing '=' padding.
          KEYSTORE_B64_CLEAN=$(printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]')
          test -n "$KEYSTORE_B64_CLEAN" || { echo "ANDROID_KEYSTORE_BASE64 is empty after cleanup"; exit 1; }

          # Validate that the secret contains Base64 characters only, then restore
          # missing padding if necessary and decode it with Python's strict decoder.
          if ! printf '%s' "$KEYSTORE_B64_CLEAN" | grep -Eq '^[A-Za-z0-9+/]*={0,2}$'; then
            echo "ANDROID_KEYSTORE_BASE64 contains characters that are not valid Base64. Recreate the secret from the .jks file.";
            exit 1
          fi
          KEYSTORE_B64_PADDED="$KEYSTORE_B64_CLEAN"
          case $(( ${#KEYSTORE_B64_PADDED} % 4 )) in
            0) ;;
            2) KEYSTORE_B64_PADDED="${KEYSTORE_B64_PADDED}==" ;;
            3) KEYSTORE_B64_PADDED="${KEYSTORE_B64_PADDED}=" ;;
            1) echo "ANDROID_KEYSTORE_BASE64 has an invalid length; the secret is corrupted."; exit 1 ;;
          esac

          KEYSTORE_B64="$KEYSTORE_B64_PADDED" python3 - <<'PY'
          import base64, os
          value = os.environ['KEYSTORE_B64']
          data = base64.b64decode(value, validate=True)
          if len(data) < 100:
              raise SystemExit('Decoded keystore is unexpectedly small; Base64 secret is likely wrong.')
          with open('android/muslim-guide-release.jks', 'wb') as f:
              f.write(data)
          PY

          test -s android/muslim-guide-release.jks || { echo "Decoded keystore is empty"; exit 1; }

          # Verify that the decoded file is a valid Java keystore without printing secrets.
          keytool -list -keystore android/muslim-guide-release.jks -storepass "$KEYSTORE_PASSWORD" >/dev/null

          printf '%s\n' "storeFile=muslim-guide-release.jks" "storePassword=$KEYSTORE_PASSWORD" "keyAlias=$KEY_ALIAS" "keyPassword=$KEY_PASSWORD" > android/keystore.properties
          python3 -c "from pathlib import Path; p=Path('android/app/build.gradle'); s=p.read_text(); marker='android {'; signing=\"    def keystorePropertiesFile = rootProject.file('keystore.properties')\\n    def keystoreProperties = new Properties()\\n    if (keystorePropertiesFile.exists()) {\\n        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\\n    }\\n    signingConfigs {\\n        release {\\n            if (keystorePropertiesFile.exists()) {\\n                storeFile file(keystoreProperties['storeFile'])\\n                storePassword keystoreProperties['storePassword']\\n                keyAlias keystoreProperties['keyAlias']\\n                keyPassword keystoreProperties['keyPassword']\\n            }\\n        }\\n    }\\n\"; s=s.replace(marker,marker+'\\n'+signing,1) if 'keystorePropertiesFile' not in s else s; s=s.replace('        release {','        release {\\n            signingConfig signingConfigs.release',1) if 'signingConfig signingConfigs.release' not in s else s; p.write_text(s)"

      - name: Configure Android version
        working-directory: android
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          python3 -c "from pathlib import Path; import os; p=Path('app/build.gradle'); s=p.read_text(); s=s.replace('versionCode 1', 'versionCode '+os.environ['VERSION_CODE'], 1); s=s.replace('versionName \"1.0\"', 'versionName \"'+os.environ['VERSION_NAME']+'\"', 1); p.write_text(s)"

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Package APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk "release/Muslim-Guide-${VERSION_NAME}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Muslim-Guide-Android-${{ steps.version.outputs.version_name }}
          path: release/*.apk
          retention-days: 30

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          gh release create "v${VERSION_NAME}" release/*.apk --title "Muslim Guide ${VERSION_NAME}" --notes "Automatic signed Android build." --target "${GITHUB_SHA}"
